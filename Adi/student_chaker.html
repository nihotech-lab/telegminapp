<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance System</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #00e676;
            --border-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        h2 {
            margin-top: 0;
            color: var(--accent-color);
        }

        .video-container img {
            width: 100%;
            border-radius: 8px;
            border: 2px solid var(--border-color);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        input[type="text"], input[type="file"], button {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #2a2a2a;
            color: #fff;
        }

        button {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        button:hover {
            opacity: 0.9;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #2a2a2a;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 4px solid var(--accent-color);
        }
    </style>
</head>
<body>

<h1 style="text-align: center; color: var(--accent-color);">Student Attendance System</h1>

<div class="container">
    <div class="card video-container">
        <h2>Live Face Detection</h2>
        <img src="/video_feed" alt="Camera Stream">
    </div>

    <div>
        <div class="card" style="margin-bottom: 20px;">
            <h2>አዲስ ተማሪ መመዝገቢያ</h2>
            <form id="registerForm">
                <input type="text" id="studentName" placeholder="የተማሪ ስም" required>
                <input type="file" id="studentImage" accept="image/*" required>
                <button type="submit">መዝግብ</button>
            </form>
            <div id="statusMessage"></div>
        </div>

        <div class="card">
            <h2>የተገኙ ተማሪዎች (Attendance)</h2>
            <ul id="attendanceList"></ul>
        </div>
    </div>
</div>

<script>
    // አዲስ ተማሪ በፎርም መመዝገቢያ
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('studentName').value;
        const imageFile = document.getElementById('studentImage').files[0];

        const formData = new FormData();
        formData.append('name', name);
        formData.append('image', imageFile);

        const response = await fetch('/register', {
            method: 'POST',
            body: formData
        });

        const result = await response.json();
        const statusDiv = document.getElementById('statusMessage');
        statusDiv.innerText = result.message;
        statusDiv.style.color = result.status === 'success' ? '#00e676' : '#ff5252';

        if(result.status === 'success') {
            document.getElementById('registerForm').reset();
        }
    });

    // አቴንዳንስ ሊስት በየ 2 ሰከንዱ አፕዴት ማድረጊያ
    async function updateAttendance() {
        const response = await fetch('/get_attendance');
        const students = await response.json();
        const list = document.getElementById('attendanceList');
        list.innerHTML = '';
        
        students.forEach(student => {
            const li = document.createElement('li');
            li.textContent = `✓ ${student}`;
            list.appendChild(li);
        });
    }

    setInterval(updateAttendance, 2000);
</script>

</body>
</html>
